[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "andes"
version = "0.1.0"
description = "ANDES gene set similarity and enrichment analysis"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
keywords = ["bioinformatics", "gene-set-analysis", "embeddings", "enrichment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numba>=0.59.1,<0.60",
    "numpy>=1.26,<1.27",
    "pandas>=2.2,<2.3",
    "scipy>=1.12,<1.13",
    "threadpoolctl>=3.5,<4",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
geo = ["GEOparse>=2.0.0"]

[project.scripts]
andes = "andes.cli:main"

[project.urls]
Repository = "https://github.com/ylaboratory/ANDES"
Publication = "https://pubmed.ncbi.nlm.nih.gov/39231608/"

[tool.setuptools.packages.find]
where = ["src"]
include = ["andes*"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "basedpyright==1.39.9",
    "pandas-stubs>=2.2.2.240603,<2.2.3",
    "pytest>=9.0.3",
    "ruff==0.16.0",
    "statsmodels==0.14.2",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "UP"]

[tool.pytest.ini_options]
filterwarnings = ["error"]
testpaths = ["tests"]
